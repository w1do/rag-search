[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-monorepo"
version = "0.1.0"
description = "Vector — единая база знаний по проектам (монорепо)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.153.0",
    "sqlalchemy==2.0.49",
    "pydantic==2.14.1",
    "alembic==1.20.0",
    "typer==0.27.3",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.setuptools]
packages = []
